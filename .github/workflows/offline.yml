name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ['51', '54']
    env:
      B47_COMPAT_LUA: ${{ matrix.lua }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install lupa==2.6
      - run: python scripts/check_versions.py --root .
      - run: python scripts/test_check_versions.py
      - run: python scripts/test_standalone_compatibility.py
      - if: matrix.lua == '51'
        run: |
          python scripts/test_speed_proof.py
          python scripts/test_mortis_speed_proof.py
